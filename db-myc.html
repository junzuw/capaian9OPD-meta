<img src="deepblueori.png" alt="Logo Instansi" class="w-full h-full object-cover">                </div>

                </div>
            </div>

            <!-- 4 KARTU RINGKASAN BARU -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-4">
                <!-- Kartu 1: Total Ruas -->
                <div class="bg-[#0740aa] p-3 rounded-2xl shadow-md border border-white/20 text-center flex flex-col justify-between">
                    <span class="text-[10px] uppercase font-semibold text-white/90 tracking-wider">Total Ruas</span>
                    <div>
                        <span class="text-sm sm:text-base font-extrabold text-white" id="totalRuas">...</span>
                        <span class="text-[10px] text-white/80 block mt-0.5" id="totalKmSubtitle">...</span>
                    </div>
                </div>

                <!-- Kartu 2: Rata-rata Realisasi -->
                <div class="bg-emerald-600 p-3 rounded-2xl shadow-md border border-white/20 text-center flex flex-col justify-between">
                    <span class="text-[10px] uppercase font-semibold text-white/90 tracking-wider">Rata-rata Realisasi</span>
                    <span class="text-sm sm:text-base font-extrabold text-white mt-1" id="rataRealisasi">...</span>
                </div>

                <!-- Kartu 3: Ruas Kritis -->
                <div class="bg-amber-600 p-3 rounded-2xl shadow-md border border-white/20 text-center flex flex-col justify-between">
                    <span class="text-[10px] uppercase font-semibold text-white/90 tracking-wider">Ruas Kritis</span>
                    <span class="text-sm sm:text-base font-extrabold text-white mt-1" id="ruasKritis">...</span>
                </div>

                <!-- Kartu 4: Total Panjang -->
                <div class="bg-purple-700 p-3 rounded-2xl shadow-md border border-white/20 text-center flex flex-col justify-between">
                    <span class="text-[10px] uppercase font-semibold text-white/90 tracking-wider">Total Panjang</span>
                    <span class="text-sm sm:text-base font-extrabold text-white mt-1" id="totalPanjangCard">...</span>
                </div>
            </div>
        </div>
    </header>

        <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-[#0740aa]/25 space-y-2">

                    <!-- Opsi paket terisi otomatis -->
                </select>
            </div>
            <div class="relative pt-1">

        globalPaketData = embeddedData.paketList;
        
        const paketSelect = document.getElementById('paketFilter');
        paketSelect.innerHTML = '';
        globalPaketData.forEach(paket => {
            const opt = document.createElement('option');
            opt.value = paket.id;
            opt.textContent = paket.namaPaket;
            paketSelect.appendChild(opt);
        });

        loadPaketData(globalPaketData[0].id);

        paketSelect.addEventListener('change', (e) => {
            loadPaketData(e.target.value);
        });

        function loadPaketData(paketId) {
            const selectedPaket = globalPaketData.find(p => p.id === paketId);
            if (!selectedPaket) return;

            activeRuasJalan = selectedPaket.ruasJalan;

            const totalRuas = activeRuasJalan.length;
            let totalRealisasi = 0;
            let kritisCount = 0;
            let totalKm = 0;

            activeRuasJalan.forEach(r => {
                totalRealisasi += r.realisasi;
                
                const devNum = parseFloat(r.deviasi.replace('%', ''));
                if (devNum < 0) kritisCount++;

                let cleanPanjang = parseFloat(r.panjang.replace(',', '.').replace(/[^0-9.]/g, '')) || 0;
                totalKm += cleanPanjang;
            });

            const rataRealisasi = totalRuas > 0 ? (totalRealisasi / totalRuas).toFixed(1) + '%' : '0%';
            const formattedTotalKm = totalKm.toFixed(2) + ' Km';

            document.getElementById('totalRuas').innerHTML = `${totalRuas} <span class="text-xs font-normal">Ruas</span>`;
            document.getElementById('totalKmSubtitle').textContent = formattedTotalKm;
            document.getElementById('rataRealisasi').textContent = rataRealisasi;
            document.getElementById('ruasKritis').innerHTML = `${kritisCount} <span class="text-xs font-normal">Ruas</span>`;
            document.getElementById('totalPanjangCard').innerHTML = `${totalKm.toFixed(1)} <span class="text-xs font-normal">Km</span>`;

            renderCards(activeRuasJalan);
        }

        function renderCards(roads) {
            const container = document.getElementById('cardContainer');
            container.innerHTML = '';

            if (roads.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-xs text-slate-400">Tidak ada data ruas jalan ditemukan.</div>';
                return;
            }

            roads.forEach((road, index) => {
                const devNum = parseFloat(road.deviasi.replace('%', ''));
                const isNegatif = devNum < 0;
                const badgeBg = isNegatif ? 'bg-rose-50 text-rose-600 border-rose-100' : 'bg-emerald-50 text-emerald-600 border-emerald-100';

                // Kartu Ruas Jalan ditambahkan outline warna biru tipis (border-[#0740aa]/25)
                const cardHTML = `
                    <div class="road-card bg-white p-4 rounded-2xl shadow-sm border border-[#0740aa]/25 hover:shadow-md transition">
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <div>
                                <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-bold">No. ${road.no} &bull; ${road.panjang}</span>
                                <h3 class="font-bold text-slate-900 text-base sm:text-lg mt-1">${road.nama}</h3>
                                <span class="text-sm text-slate-500 font-medium">Kab. ${road.kabupaten}</span>
                            </div>
                            <span class="text-sm font-bold px-3 py-1 rounded-full ${badgeBg} border whitespace-nowrap">Dev. ${road.deviasi}</span>
                        </div>

                        <div class="mt-3 bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <div class="flex justify-between text-sm mb-1">
                                <span class="font-semibold text-slate-600">Target Rencana (MYC)</span>
                                <span class="font-bold text-blue-600">${road.rencana}%</span>
                            </div>
                            <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                                <div class="bg-blue-600 h-full rounded-full" style="width: ${Math.min(road.rencana, 100)}%;"></div>
                            </div>
                        </div>

                        <div class="mt-3 pt-3 border-t border-slate-100">
                            <span class="text-xs font-bold text-slate-500 uppercase block mb-1">Tren Realisasi Tahunan (Jan - Des 2026)</span>
                            <div class="h-28 w-full relative">
                                <canvas id="chart-${index}"></canvas>
                            </div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHTML);

                // Render Chart.js
                setTimeout(() => {
                    const canvas = document.getElementById(`chart-${index}`);
                    if(canvas) {
                        const ctx = canvas.getContext('2d');
                        const gradient = ctx.createLinearGradient(0, 0, 0, 110);
                        gradient.addColorStop(0, 'rgba(239, 68, 68, 0.4)');
                        gradient.addColorStop(1, 'rgba(239, 68, 68, 0.0)');

                        const realisasiVal = road.realisasi;
                        const monthlyData = [0, 0, 0, 0, 0, 0, 0, 0, 0, realisasiVal, realisasiVal, realisasiVal];

                        new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'],
                                datasets: [{
                                    data: monthlyData,
                                    borderColor: '#ef4444',
                                    backgroundColor: gradient,
                                    borderWidth: 2.5,
                                    pointBackgroundColor: '#ef4444',
                                    pointBorderColor: '#ffffff',
                                    pointBorderWidth: 2,
                                    pointRadius: function(context) {
                                        return context.dataIndex >= 9 ? 4 : 0;
                                    },
                                    pointHoverRadius: 6,
                                    fill: true,
                                    tension: 0.3
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: {
                                    legend: { display: false },
                                    tooltip: { enabled: false },
                                    datalabels: {
                                        align: 'top',
                                        anchor: 'end',
                                        color: '#334155',
                                        font: { size: 9, weight: 'bold' },
                                        formatter: function(value, context) {
                                            return context.dataIndex >= 9 ? value + '%' : '';
                                        }
                                    }
                                },
                                scales: {
                                    x: { grid: { display: false }, ticks: { font: { size: 9 } } },
                                    y: { display: false, grid: { display: false }, suggestedMin: 0, suggestedMax: 105 }
                                }
                            }
                        });
                    }
                }, 50);
            });
        }

        // Live Search
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('keyup', function(e) {
            const term = e.target.value.toLowerCase();
            const filtered = activeRuasJalan.filter(road => 
                road.nama.toLowerCase().includes(term) || 
                road.kabupaten.toLowerCase().includes(term)
            );
            renderCards(filtered);
        });
    </script>
