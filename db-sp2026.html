    <script>
        const APPSCRIPT_URL = "https://script.google.com/macros/s/AKfycbxcDHB2OrA5O4uG8Q9kNkUasKko8oRT_vq8xqVGm66sKmjnod5QK_pdWKkMvm-es_pD/exec";
        let proyekData = [];
        let kategoriAktif = 'semua';
        const tapSound = new Audio("tap_sound.mp3");
        tapSound.preload = "auto";
        tapSound.volume = 0.4;

        function bukaDashboard() {
            tapSound.currentTime = 0;
            tapSound.play().catch(err => {
                console.log("Audio diblokir browser sampai ada interaksi:", err);
            });
            document.getElementById('splashScreen').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
            muatDataDariGoogleSheets();
        }

        function muatDataDariGoogleSheets() {
            fetch(APPSCRIPT_URL + "?action=getProyek")
                .then(response => response.json())
                .then(data => {
                    if (data && data.views !== undefined) {
                        document.getElementById("global_visitor_count").innerText = parseInt(data.views).toLocaleString('id-ID');
                    }

                    let listMentah = Array.isArray(data) ? data : (data && data.proyek ? data.proyek : []);
                    if (listMentah.length === 0) {
                        document.getElementById('mainContent').innerHTML = `<p style="text-align:center; padding:20px; color:#f59e0b; font-weight:700;">Data kosong.</p>`;
                        return;
                    }

                    proyekData = listMentah;
                    const groupedData = {};

                    proyekData.forEach(item => {
                        let namaOPD = item.opd ? item.opd.toString().trim() : "LAINNYA";
                        if (!groupedData[namaOPD]) groupedData[namaOPD] = [];
                        groupedData[namaOPD].push(item);
                    });

                    renderData(groupedData);
                })
                .catch(err => {
                    console.error("Error:", err);
                    document.getElementById('mainContent').innerHTML = `<p style="text-align:center; padding:30px; color:#ef4444;">Gagal memuat data dari server.</p>`;
                });
        }

        function formatRupiah(nilai) {
            if (!nilai) return "Rp 0";
            let nilaiMentah = nilai.toString().trim().replace(/[^0-9.,]/g, '');
            if (nilaiMentah === "") return nilai;

            let angkaBersih = nilaiMentah;
            if (nilaiMentah.includes(',') && nilaiMentah.includes('.')) {
                if (nilaiMentah.lastIndexOf(',') > nilaiMentah.lastIndexOf('.')) {
                    angkaBersih = nilaiMentah.replace(/\./g, '').replace(',', '.');
                } else {
                    angkaBersih = nilaiMentah.replace(/,/g, '');
                }
            } else if (nilaiMentah.includes(',')) {
                angkaBersih = nilaiMentah.replace(/\./g, '').replace(',', '.');
            } else if (nilaiMentah.split('.').length > 2) {
                angkaBersih = nilaiMentah.replace(/\./g, '');
            }

            let angka = parseFloat(angkaBersih);
            if (isNaN(angka)) return nilai;

            return "Rp " + angka.toLocaleString('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        }

        // Fungsi untuk mencocokkan nama OPD dengan file logo berawalan "logo-"
        function getLogoFilename(namaOPD) {
            let nama = namaOPD ? namaOPD.toString().toLowerCase().trim() : "";

            if (nama.includes("perhubungan") || nama.includes("dishub")) return "logo-dishub.png";
            if (nama.includes("kominfo") || nama.includes("komunikasi")) return "logo-kominfo.png";
            if (nama.includes("bappelitbangda") || nama.includes("bappeda")) return "logo-bappeda.png";
            if (nama.includes("perkimtan")) return "logo-perkimtan.png";
            if (nama.includes("bmbk") || nama.includes("binamarga") || nama.includes("bm")) return "logo-bmbk.png";
            if (nama.includes("sdacktr") || nama.includes("sda") || nama.includes("cktr")) return "logo-sdacktr.png";
            if (nama.includes("bpbd")) return "logo-bpbd.png";

            // Fallback default jika ada nama lain
            return "logo.png";
        }

        function deteksiKategoriWarna(warnaHex, teksStatus) {
            let statusStr = teksStatus ? teksStatus.toString().toLowerCase().trim() : "";

            if (statusStr.includes("batal") || statusStr.includes("ditunda") || statusStr.includes("tidak lanjut")) {
                return "merah";
            }
            if (statusStr.includes("selesai") || statusStr.includes("terlaksana") || statusStr.includes("tuntas") || statusStr.includes("100%")) {
                return "biru";
            }
            if (statusStr.includes("jalan") || statusStr.includes("proses") || statusStr.includes("berjalan") || statusStr.includes("kontrak")) {
                return "hijau";
            }
            if (statusStr.includes("persiapan") || statusStr.includes("rencana") || statusStr.includes("belum") || statusStr.includes("usul")) {
                return "kuning";
            }

            if (!warnaHex) return "lainnya";
            let c = warnaHex.toString().toLowerCase().trim();

            if (c === "#ffffff" || c === "white" || c === "" || c === "rgb(255, 255, 255)") return "lainnya";

            if (c.includes("ff0000") || c.includes("red") || c.includes("ea4335") || c.includes("cc0000") || c.includes("e06666")) {
                return "merah";
            }
            if (c.includes("b0f0") || c.includes("00b0f") || c.includes("176, 240") || c.includes("blue") || c.includes("c9da") || c.includes("cfe2") || c.includes("6fa8")) {
                return "biru";
            }
            if (c.includes("b050") || c.includes("00b0") || c.includes("green") || c.includes("b7e1") || c.includes("d9ea") || c.includes("0, 176, 80")) {
                return "hijau";
            }
            if (c.includes("ffff") || c.includes("yellow") || c.includes("ffeb") || c.includes("fef0") || c.includes("255, 255, 0")) {
                return "kuning";
            }

            if (c.startsWith("rgb")) {
                let match = c.match(/\d+/g);
                if (match && match.length >= 3) {
                    let r = parseInt(match[0]), g = parseInt(match[1]), b = parseInt(match[2]);
                    if (r > 200 && g < 100 && b < 100) return "merah";
                    if (b > r && b > g) return "biru";
                    if (g > r && g > b) return "hijau";
                    if (r > 150 && g > 150) return "kuning";
                }
            }

            return "lainnya";
        }

        function getBadgeStyle(warnaHex, teksStatus) {
            let kat = deteksiKategoriWarna(warnaHex, teksStatus);
            if (kat === "kuning") return "background-color: #ffff00; color: #713f12; font-weight: 800;";
            if (kat === "hijau") return "background-color: #00b050; color: #ffffff; font-weight: 800;";
            if (kat === "biru") return "background-color: #00b0f0; color: #ffffff; font-weight: 800;";
            if (kat === "merah") return "background-color: #ff0000; color: #ffffff; font-weight: 800;";

            return `background-color: ${warnaHex || '#f1f5f9'}; color: #0f172a;`;
        }

        function hitungTotalAlokasi(listKegiatan) {
            let total = 0;
            listKegiatan.forEach(keg => {
                let uraian = keg.kegiatan ? keg.kegiatan.toString().trim().toUpperCase() : "";
                if (uraian.includes("TOTAL") || uraian.includes("JUMLAH")) {
                    return;
                }

                if (keg.anggaran) {
                    let nilaiMentah = keg.anggaran.toString().trim().replace(/[^0-9.,]/g, '');
                    let angkaBersih = nilaiMentah;

                    if (nilaiMentah.includes(',') && nilaiMentah.includes('.')) {
                        if (nilaiMentah.lastIndexOf(',') > nilaiMentah.lastIndexOf('.')) {
                            angkaBersih = nilaiMentah.replace(/\./g, '').replace(',', '.');
                        } else {
                            angkaBersih = nilaiMentah.replace(/,/g, '');
                        }
                    } else if (nilaiMentah.includes(',')) {
                        angkaBersih = nilaiMentah.replace(/\./g, '').replace(',', '.');
                    } else if (nilaiMentah.split('.').length > 2) {
                        angkaBersih = nilaiMentah.replace(/\./g, '');
                    }

                    let angka = parseFloat(angkaBersih);
                    if (!isNaN(angka)) {
                        total += angka;
                    }
                }
            });
            return "Rp " + Math.round(total).toLocaleString('id-ID');
        }

        function parseNilaiFisik(fisikStr) {
            if (!fisikStr) return 0;
            let bersih = fisikStr.toString().trim().replace(/[^0-9.,]/g, '').replace(',', '.');
            let val = parseFloat(bersih);
            if (isNaN(val)) return 0;
            return Math.min(Math.max(Math.round(val), 0), 100);
        }

        // Fungsi untuk membaca data mingguan dari Kolom F sampai N (Okt - Des)
        function parseMingguanData(keg) {
            return [
                { label: "Mg IV Okt", nilai: parseNilaiFisik(keg.mg_iv_okt || keg.f || "0%") },
                { label: "Mg I Nov", nilai: parseNilaiFisik(keg.mg_i_nov || keg.g || "0%") },
                { label: "Mg II Nov", nilai: parseNilaiFisik(keg.mg_ii_nov || keg.h || "0%") },
                { label: "Mg III Nov", nilai: parseNilaiFisik(keg.mg_iii_nov || keg.i || "0%") },
                { label: "Mg IV Nov", nilai: parseNilaiFisik(keg.mg_iv_nov || keg.j || "0%") },
                { label: "Mg I Des", nilai: parseNilaiFisik(keg.mg_i_des || keg.k || "0%") },
                { label: "Mg II Des", nilai: parseNilaiFisik(keg.mg_ii_des || keg.l || "0%") },
                { label: "Mg III Des", nilai: parseNilaiFisik(keg.mg_iii_des || keg.m || "0%") },
                { label: "Mg IV Des", nilai: parseNilaiFisik(keg.mg_iv_des || keg.n || "0%") }
            ];
        }

        function renderData(groupedData) {
            const mainContent = document.getElementById('mainContent');

            let totalSemuaKegiatan = 0;
            let akumulasiAlokasiSemua = 0;

            urutanOPD.forEach(namaOPD => {

                groupedData[namaOPD] = listKegiatan.filter(keg => {

                    let anggaranCek = keg.anggaran ? keg.anggaran.toString().trim().toUpperCase() : "";
                    return uraian !== "" && !uraian.includes("TOTAL") && !uraian.includes("JUMLAH") && !anggaranCek.includes("TOTAL");

            urutanOPD.forEach(namaOPD => {

                            if (nilaiMentah.lastIndexOf(',') > nilaiMentah.lastIndexOf('.')) {

                            } else {
                                angkaBersih = nilaiMentah.replace(/,/g, '');

                        }
                    }
                    let fisikStr = progresTerakhir + "%";

                    // KONFIGURASI GRAFIK KEGIATAN (Dengan Padding Aman)
                    let lebarSVG = 320;

                    let grafikHtml = `

                                <line x1="${paddingX}" y1="60" x2="${lebarSVG - paddingX}" y2="60" stroke="#cbd5e1" stroke-dasharray="2,2" stroke-width="0.5" />`;
                    
                    let titikKordinat = [];
                    dataMingguan.forEach((mg, i) => {
                        let x = paddingX + (i * (usableWidth / (dataMingguan.length - 1)));

                    let pointsString = titikKordinat.map(pt => `${pt.x},${pt.y}`).join(' ');
                    let areaPointsString = `${paddingX},65 ${pointsString} ${lebarSVG - paddingX},65`;

                    grafikHtml += `<polygon points="${areaPointsString}" fill="url(#gradasiOranye_${idx})" />`;
                    grafikHtml += `<polyline fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${pointsString}" />`;

                    titikKordinat.forEach((pt, ti) => {
                        let anchor = "middle";
                        if (ti === 0) anchor = "start";
                        if (ti === dataMingguan.length - 1) anchor = "end";
                        grafikHtml += `
                            <g>
                                <circle cx="${pt.x}" cy="${pt.y}" r="3.5" fill="#ffffff" stroke="#f97316" stroke-width="2" />
                                <text x="${pt.x}" y="${pt.y - 7}" font-size="7.5" font-weight="bold" fill="#1e293b" text-anchor="middle">${pt.nilai}%</text>

                    });
                    grafikHtml += `</svg></div>`;

                    kegiatanHtml += `
                        <div class="kegiatan-card" data-nama="${uraian.toLowerCase()}" data-kategori="${warnaKat}">
                            <div class="kegiatan-main-info">
                                <div class="kegiatan-text-cell">
                                    <div class="kegiatan-title">${nomorUrut}. ${uraian}</div>
                                    <div class="kegiatan-pagu">Alokasi: ${alokasi}</div>
                                    <div class="progress-container">
                                        <div class="progress-label-wrap">
                                            <span>Progres Fisik Terkini</span>
                                            <span>${fisikStr}</span>
                                        </div>
                                        <div class="progress-bar-bg">
                                            <div class="progress-bar-fill" style="width: ${progresTerakhir}%;"></div>
                                        </div>
                                    </div>
                                </div>
                                <div class="kegiatan-action-cell">
                                    <button class="btn btn-orange" onclick="toggleSubDetail(this)">Detail</button>
                                </div>
                            </div>
                            <div class="kegiatan-sub-detail">
                                <div class="view-mode">
                                    <div class="detail-row"><div class="detail-label">Status Saat Ini</div><div class="detail-value"><span class="status-badge view-status" style="${badgeStyle}">${status}</span></div></div>
                                    ${grafikHtml}
                                    <div class="detail-row"><div class="detail-label">Keterangan</div><div class="detail-value view-ket">${ket}</div></div>
                                    <button class="btn-edit-full" onclick="aktifkanModeEdit(this)">✏️ Edit Langsung Data Ini</button>
                                </div>
                                <div class="edit-mode" style="display: none;">
                                    <div class="detail-row">
                                        <div class="detail-label">Status Saat Ini</div>
                                        <div class="detail-value"><input type="text" class="edit-input-status" value="${status}" style="width:100%; padding:4px; font-size:12.5px; border:1px solid #cbd5e1; border-radius:4px;"></div>

                                        <div class="detail-label">Progres Fisik Terkini</div>

                                    <div class="detail-row">
                                        <div class="detail-label">Keterangan</div>
                                        <div class="detail-value"><textarea class="edit-input-ket" rows="2" style="width:100%; padding:4px; font-size:12.5px; border:1px solid #cbd5e1; border-radius:4px;">${ket}</textarea></div>
                                    </div>
                                    <div style="display: flex; gap: 8px; margin-top: 10px;">
                                        <button class="btn" style="flex:1; background:#10b981; color:#fff; padding:6px;" onclick="simpanDataEditable(this, '${namaOPD}', '${uraian}')">💾 Simpan</button>
                                        <button class="btn" style="flex:1; background:#64748b; color:#fff; padding:6px;" onclick="batalModeEdit(this)">Batal</button>
                                    </div>
                                </div>
                            </div>

                });

                // PERHITUNGAN GRAFIK AKUMULASI OPD (Dengan Padding Aman yang Sama)
                let akumulasiMingguanOPD = [0,0,0,0,0,0,0,0,0];
                let jumlahKegiatanAktif = listKegiatan.length;
                listKegiatan.forEach(keg => {
                    let mgKeg = parseMingguanData(keg);
                    mgKeg.forEach((mg, idx) => { akumulasiMingguanOPD[idx] += mg.nilai; });
                });

                let dataMingguanOPD = akumulasiMingguanOPD.map((totalNilai, idx) => {
                    let rataRata = jumlahKegiatanAktif > 0 ? Math.round(totalNilai / jumlahKegiatanAktif) : 0;
                    let labels = ["Mg IV Okt", "Mg I Nov", "Mg II Nov", "Mg III Nov", "Mg IV Nov", "Mg I Des", "Mg II Des", "Mg III Des", "Mg IV Des"];
                    return { label: labels[idx], nilai: rataRata };
                });

                let lebarSVGOpd = 320;
                let tinggiSVGOpd = 80;
                let paddingXOpd = 12;
                let usableWidthOpd = lebarSVGOpd - (paddingXOpd * 2);

                let grafikOpdHtml = `
                    <div class="opd-grafik-akumulasi" style="margin-top: 10px; padding-top: 8px; border-top: 1px dashed #e2e8f0; width: 100%;">
                        <div style="font-size: 10.5px; font-weight: 700; color: #0740aa; margin-bottom: 6px; display: flex; justify-content: space-between; padding-left: 2px; padding-right: 2px;">
                            <span>📈 Tren Akumulasi Progres Fisik OPD</span>
                            <span style="color: #64748b; font-weight: 600;">Rata-rata</span>
                        </div>
                        <svg viewBox="0 0 ${lebarSVGOpd} ${tinggiSVGOpd}" style="width: 100%; height: auto; max-height: 120px; overflow: visible; display: block;">
                            <defs>
                                <linearGradient id="gradasiBiru_${index}" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stop-color="#0740aa" stop-opacity="0.45" />
                                    <stop offset="100%" stop-color="#0740aa" stop-opacity="0.0" />
                                </linearGradient>
                            </defs>
                            <line x1="${paddingXOpd}" y1="12" x2="${lebarSVGOpd - paddingXOpd}" y2="12" stroke="#cbd5e1" stroke-dasharray="2,2" stroke-width="0.5" />

                            <line x1="${paddingXOpd}" y1="60" x2="${lebarSVGOpd - paddingXOpd}" y2="60" stroke="#cbd5e1" stroke-dasharray="2,2" stroke-width="0.5" />`;

                let titikKoordOpd = [];
                dataMingguanOPD.forEach((mg, i) => {

                    let y = tinggiSVGOpd - 18 - ((mg.nilai / 100) * (tinggiSVGOpd - 30));
                    titikKoordOpd.push({ x: x, y: y, label: mg.label, nilai: mg.nilai });
                });

                let pointsStrOpd = titikKoordOpd.map(pt => `${pt.x},${pt.y}`).join(' ');
                let areaStrOpd = `${paddingXOpd},65 ${pointsStrOpd} ${lebarSVGOpd - paddingXOpd},65`;

                    <div class="opd-main-info">

                        </div>
                        <div class="opd-details-cell">
                            <div class="opd-title">${namaOPD}</div>
                            <div class="opd-meta">
                                Alokasi: <span class="pagu-total">${totalAlokasiOPD}</span><br>
                                Jumlah: <span>${listKegiatan.length} Kegiatan</span>
                            </div>

                            <button class="btn btn-primary" onclick="toggleOPD(this, 'list-${idOPD}')">Detail</button>

                    <div id="list-${idOPD}" class="kegiatan-container">${kegiatanHtml}</div>`;
                mainContent.appendChild(opdCard);
            });

            mulasiAnimasiJatuhBerurutan();
        }

        function mulasiAnimasiJatuhBerurutan() {
            const semuaKartu = document.querySelectorAll('.opd-card');
            semuaKartu.forEach((kartu, index) => {
                setTimeout(() => {
                    kartu.classList.add('mulai-animasi');

                    // Mainkan suara secara berurutan seiring jatuhnya kartu
                    try {
                        let cloneSound = tapSound.cloneNode(); // Clone agar bisa bunyi bertumpuk cepat
                        cloneSound.volume = 0.3;
                        cloneSound.play().catch(() => { });
                    } catch (e) { }

                }, index * 100);
            });
        }

        function filterKategori(kategori, btnElement) {
            // Mainkan suara saat tombol filter diklik
            try {
                tapSound.currentTime = 0;
                tapSound.play().catch(() => { });
            } catch (e) { }

            kategoriAktif = kategori;

            document.querySelectorAll('.btn-filter-kat').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            jalankanPencarian();
        }

        function toggleOPD(button, containerId) {
            try {
                tapSound.currentTime = 0;
                tapSound.play().catch(() => { });
            } catch (e) { }

            var opdCard = button.closest('.opd-card');
            var container = document.getElementById(containerId);
            var grafikAkumulasi = opdCard.querySelector('.opd-grafik-akumulasi');

            if (container.style.display === "block") {
                container.style.display = "none";
                if (grafikAkumulasi) grafikAkumulasi.style.display = "block"; // Munculkan kembali grafik saat ditutup
                button.textContent = "Detail";
                button.className = "btn btn-primary";
            } else {
                container.style.display = "block";
                if (grafikAkumulasi) grafikAkumulasi.style.display = "none";  // Sembunyikan grafik saat tombol detail diklik
                button.textContent = "Tutup";
                button.className = "btn btn-success";
            }
        }

        function toggleSubDetail(button) {
            // Mainkan suara saat tombol Detail/Tutup Kegiatan diklik
            try {
                tapSound.currentTime = 0;
                tapSound.play().catch(() => { });
            } catch (e) { }

            var kegiatanCard = button.closest('.kegiatan-card');
            var subDetail = kegiatanCard.querySelector('.kegiatan-sub-detail');
            if (subDetail.style.display === "block") {
                subDetail.style.display = "none";
                button.textContent = "Detail";
                button.className = "btn btn-orange";
            } else {
                document.querySelectorAll('.kegiatan-sub-detail').forEach(el => el.style.display = 'none');
                subDetail.style.display = "block";
                button.textContent = "Tutup";
                button.className = "btn btn-success";
            }
        }

        function jalankanPencarian() {
            let keyword = document.getElementById('searchInput').value.toLowerCase();
            let kartuOPD = document.querySelectorAll('.opd-card');

            kartuOPD.forEach(opdCard => {
                let containerKegiatan = opdCard.querySelector('.kegiatan-container');
                let tombolOPD = opdCard.querySelector('.opd-action-cell button');
                let daftarKegiatan = opdCard.querySelectorAll('.kegiatan-card');

                if (daftarKegiatan.length === 0) return;

                let adaKegiatanCocok = false;

                daftarKegiatan.forEach(card => {
                    let nama = card.getAttribute('data-nama') || "";
                    let katWarna = card.getAttribute('data-kategori') || "";

                    let cocokKeyword = (keyword === "" || nama.includes(keyword));
                    let cocokKategori = (kategoriAktif === 'semua' || katWarna === kategoriAktif);

                    if (cocokKeyword && cocokKategori) {
                        card.style.display = "block";
                        adaKegiatanCocok = true;
                    } else {
                        card.style.display = "none";
                    }
                });

                if (keyword !== "" || kategoriAktif !== 'semua') {
                    if (adaKegiatanCocok) {
                        opdCard.style.display = "block";
                        if (containerKegiatan) containerKegiatan.style.display = "block";
                        if (tombolOPD) {
                            tombolOPD.textContent = "Tutup";
                            tombolOPD.className = "btn btn-success";
                        }
                    } else {
                        opdCard.style.display = "none";
                    }
                } else {
                    opdCard.style.display = "block";
                    if (containerKegiatan) containerKegiatan.style.display = "none";
                    if (tombolOPD) {
                        tombolOPD.textContent = "Detail";
                        tombolOPD.className = "btn btn-primary";
                    }
                }
            });
        }

        function bukaFormEdit(namaOPD, uraianKegiatan, statusLama, fisikLama, ketLama) {
            try {
                tapSound.currentTime = 0;
                tapSound.play().catch(() => { });
            } catch (e) { }

            let statusBaru = prompt(`[EDIT STATUS SAAT INI]\nOPD: ${namaOPD}\nKegiatan: ${uraianKegiatan}\n\nMasukkan status baru:`, statusLama);
            if (statusBaru === null) return; // Batal jika tombol cancel ditekan

            let fisikBaru = prompt(`[EDIT PROGRES FISIK (%)]\nMasukkan persentase fisik baru (contoh: 75% atau 75):`, fisikLama);
            if (fisikBaru === null) return;

            let ketBaru = prompt(`[EDIT KETERANGAN]\nMasukkan keterangan baru:`, ketLama);
            if (ketBaru === null) return;

            alert(`Simulasi Perubahan Berhasil!\n\nOPD: ${namaOPD}\nKegiatan: ${uraianKegiatan}\n- Status Baru: ${statusBaru}\n- Fisik Baru: ${fisikBaru}\n- Keterangan Baru: ${ketBaru}\n\n*Catatan: Nilai ini baru simulasi di browser. Jika ingin permanen, data ini nantinya dikirim menggunakan fetch() ke Google Apps Script.*`);
        }
        // Fungsi saat tombol Edit diklik (mengubah tampilan menjadi kotak isian)
        function aktifkanModeEdit(button) {
            try { tapSound.currentTime = 0; tapSound.play().catch(() => { }); } catch (e) { }

            let subDetail = button.closest('.kegiatan-sub-detail');
            subDetail.querySelector('.view-mode').style.display = 'none';
            subDetail.querySelector('.edit-mode').style.display = 'block';
        }

        // Fungsi saat tombol Batal diklik
        function batalModeEdit(button) {
            try { tapSound.currentTime = 0; tapSound.play().catch(() => { }); } catch (e) { }

            let subDetail = button.closest('.kegiatan-sub-detail');
            subDetail.querySelector('.edit-mode').style.display = 'none';
            subDetail.querySelector('.view-mode').style.display = 'block';
        }

        // Fungsi saat tombol Simpan diklik
        function simpanDataEditable(button, namaOPD, uraianKegiatan) {
            try { tapSound.currentTime = 0; tapSound.play().catch(() => { }); } catch (e) { }

            let subDetail = button.closest('.kegiatan-sub-detail');

            let statusBaru = subDetail.querySelector('.edit-input-status').value;
            let ketBaru = subDetail.querySelector('.edit-input-ket').value;

            // Kumpulkan nilai mingguan dari form edit jika ada
            let mgInputs = subDetail.querySelectorAll('.edit-input-mg');
            let mgParams = "";
            mgInputs.forEach((input, idx) => {
                mgParams += `&mg${idx}=${encodeURIComponent(input.value)}`;
            });

            let btnSimpan = button;
            let teksAsli = btnSimpan.innerText;
            btnSimpan.innerText = "⏳ Menyimpan...";
            btnSimpan.disabled = true;

            let urlUpdate = APPSCRIPT_URL + `?action=updateData&opd=${encodeURIComponent(namaOPD)}&kegiatan=${encodeURIComponent(uraianKegiatan)}&status=${encodeURIComponent(statusBaru)}&keterangan=${encodeURIComponent(ketBaru)}` + mgParams;

            fetch(urlUpdate)
                .then(response => response.json())
                .then(result => {
                    btnSimpan.innerText = teksAsli;
                    btnSimpan.disabled = false;

                    if (result.status === "success") {
                        subDetail.querySelector('.view-status').innerText = statusBaru;
                        subDetail.querySelector('.view-ket').innerText = ketBaru;

                        subDetail.querySelector('.edit-mode').style.display = 'none';
                        subDetail.querySelector('.view-mode').style.display = 'block';

                        alert("✅ Data mingguan berhasil disimpan secara permanen ke Google Spreadsheet!");
                        // Muat ulang data agar grafik langsung ter-refresh
                        muatDataDariGoogleSheets();
                    } else {
                        alert("⚠️ Gagal menyimpan: " + (result.message || "Terjadi kesalahan pada server."));
                    }
                })
                .catch(error => {
                    btnSimpan.innerText = teksAsli;
                    btnSimpan.disabled = false;
                    console.error("Error:", error);
                    alert("❌ Terjadi kesalahan jaringan saat menyimpan data.");
                });
        }
    </script>
</body>
