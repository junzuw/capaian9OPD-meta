<body>

    <script>
        const APPSCRIPT_URL = "https://script.google.com/macros/s/AKfycbzTc2Bt8Vgx1TPebfNUJT4MXMxUJbcEPM-SLXvnsksbWOjBqdtYJeE7CTD3AgHLloYr/exec";
        let proyekData = [];
        let kategoriAktif = 'semua';
        const tapSound = new Audio("tap_sound.mp3");
        tapSound.preload = "auto";
        tapSound.volume = 0.4;

        function bukaDashboard() {
            tapSound.currentTime = 0;
            tapSound.play().catch(err => {
                console.log("Audio diblokir browser sampai ada interaksi:", err);
            });
            document.getElementById('splashScreen').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
            muatDataDariGoogleSheets();
        }

        function muatDataDariGoogleSheets() {
            fetch(APPSCRIPT_URL + "?action=getProyek")
                .then(response => response.json())
                .then(data => {
                    if (data && data.views !== undefined) {
                        document.getElementById("global_visitor_count").innerText = parseInt(data.views).toLocaleString('id-ID');
                    }

                    let listMentah = Array.isArray(data) ? data : (data && data.proyek ? data.proyek : []);
                    if (listMentah.length === 0) {
                        document.getElementById('mainContent').innerHTML = `<p style="text-align:center; padding:20px; color:#f59e0b; font-weight:700;">Data kosong.</p>`;
                        return;
                    }

                    proyekData = listMentah;
                    const groupedData = {};
                    
                    proyekData.forEach(item => {
                        let namaOPD = item.opd ? item.opd.toString().trim() : "LAINNYA";
                        if (!groupedData[namaOPD]) groupedData[namaOPD] = [];
                        groupedData[namaOPD].push(item);
                    });

                    renderData(groupedData);
                })
                .catch(err => {
                    console.error("Error:", err);
                    document.getElementById('mainContent').innerHTML = `<p style="text-align:center; padding:30px; color:#ef4444;">Gagal memuat data dari server.</p>`;
                });
        }

        function formatRupiah(nilai) {
            if (!nilai) return "Rp 0";
            let nilaiMentah = nilai.toString().trim().replace(/[^0-9.,]/g, '');
            if (nilaiMentah === "") return nilai;

            let angkaBersih = nilaiMentah;
            if (nilaiMentah.includes(',') && nilaiMentah.includes('.')) {
                if (nilaiMentah.lastIndexOf(',') > nilaiMentah.lastIndexOf('.')) {
                    angkaBersih = nilaiMentah.replace(/\./g, '').replace(',', '.');
                } else {
                    angkaBersih = nilaiMentah.replace(/,/g, '');
                }
            } else if (nilaiMentah.includes(',')) {
                angkaBersih = nilaiMentah.replace(/\./g, '').replace(',', '.');
            } else if (nilaiMentah.split('.').length > 2) {
                angkaBersih = nilaiMentah.replace(/\./g, '');
            }

            let angka = parseFloat(angkaBersih);
            if (isNaN(angka)) return nilai;

            return "Rp " + angka.toLocaleString('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        }

// Fungsi untuk mencocokkan nama OPD dengan file logo berawalan "logo-"
        function getLogoFilename(namaOPD) {
            let nama = namaOPD ? namaOPD.toString().toLowerCase().trim() : "";
            
            if (nama.includes("perhubungan") || nama.includes("dishub")) return "logo-dishub.png";
            if (nama.includes("kominfo") || nama.includes("komunikasi")) return "logo-kominfo.png";
            if (naif (nama.includes("bappelitbangda") || nama.includes("bappeda")) return "logo-bappeda.png";
            if (nama.includes("perkimtan")) return "logo-perkimtan.png";
            if (nama.includes("bmbk") || nama.includes("binamarga") || nama.includes("bm")) return "logo-bmbk.png";
            if (nama.includes("sdacktr") || nama.includes("sda") || nama.includes("cktr")) return "logo-sdacktr.png";
            if (nama.includes("bpbd")) return "logo-bpbd.png";
            
            // Fallback default jika ada nama lain
            return "logo.png";
        }

        function deteksiKategoriWarna(warnaHex, teksStatus) {
            let statusStr = teksStatus ? teksStatus.toString().toLowerCase().trim() : "";
            
            if (statusStr.includes("batal") || statusStr.includes("ditunda") || statusStr.includes("tidak lanjut")) {
                return "merah";
            }
            if (statusStr.includes("selesai") || statusStr.includes("terlaksana") || statusStr.includes("tuntas") || statusStr.includes("100%")) {
                return "biru";
            }
            if (statusStr.includes("jalan") || statusStr.includes("proses") || statusStr.includes("berjalan") || statusStr.includes("kontrak")) {
                return "hijau";
            }
            if (statusStr.includes("persiapan") || statusStr.includes("rencana") || statusStr.includes("belum") || statusStr.includes("usul")) {
                return "kuning";
            }

            if (!warnaHex) return "lainnya";
            let c = warnaHex.toString().toLowerCase().trim();
            
            if (c === "#ffffff" || c === "white" || c === "" || c === "rgb(255, 255, 255)") return "lainnya";

            if (c.includes("ff0000") || c.includes("red") || c.includes("ea4335") || c.includes("cc0000") || c.includes("e06666")) {
                return "merah";
            }
            if (c.includes("b0f0") || c.includes("00b0f") || c.includes("176, 240") || c.includes("blue") || c.includes("c9da") || c.includes("cfe2") || c.includes("6fa8")) {
                return "biru";
            }
            if (c.includes("b050") || c.includes("00b0") || c.includes("green") || c.includes("b7e1") || c.includes("d9ea") || c.includes("0, 176, 80")) {
                return "hijau";
            }
            if (c.includes("ffff") || c.includes("yellow") || c.includes("ffeb") || c.includes("fef0") || c.includes("255, 255, 0")) {
                return "kuning";
            }

            if (c.startsWith("rgb")) {
                let match = c.match(/\d+/g);
                if (match && match.length >= 3) {
                    let r = parseInt(match[0]), g = parseInt(match[1]), b = parseInt(match[2]);
                    if (r > 200 && g < 100 && b < 100) return "merah";
                    if (b > r && b > g) return "biru";
                    if (g > r && g > b) return "hijau";
                    if (r > 150 && g > 150) return "kuning";
                }
            }

            return "lainnya";
        }

        function getBadgeStyle(warnaHex, teksStatus) {
            let kat = deteksiKategoriWarna(warnaHex, teksStatus);
            if (kat === "kuning") return "background-color: #ffff00; color: #713f12; font-weight: 800;";
            if (kat === "hijau") return "background-color: #00b050; color: #ffffff; font-weight: 800;";
            if (kat === "biru") return "background-color: #00b0f0; color: #ffffff; font-weight: 800;";
            if (kat === "merah") return "background-color: #ff0000; color: #ffffff; font-weight: 800;";
            
            return `background-color: ${warnaHex || '#f1f5f9'}; color: #0f172a;`;
        }

        function hitungTotalAlokasi(listKegiatan) {
            let total = 0;
            listKegiatan.forEach(keg => {
                let uraian = keg.kegiatan ? keg.kegiatan.toString().trim().toUpperCase() : "";
                if (uraian.includes("TOTAL") || uraian.includes("JUMLAH")) {
                    return; 
                }

                if (keg.anggaran) {
                    let nilaiMentah = keg.anggaran.toString().trim().replace(/[^0-9.,]/g, '');
                    let angkaBersih = nilaiMentah;

                    if (nilaiMentah.includes(',') && nilaiMentah.includes('.')) {
                        if (nilaiMentah.lastIndexOf(',') > nilaiMentah.lastIndexOf('.')) {
                            angkaBersih = nilaiMentah.replace(/\./g, '').replace(',', '.');
                        } else {
                            angkaBersih = nilaiMentah.replace(/,/g, '');
                        }
                    } else if (nilaiMentah.includes(',')) {
                        angkaBersih = nilaiMentah.replace(/\./g, '').replace(',', '.');
                    } else if (nilaiMentah.split('.').length > 2) {
                        angkaBersih = nilaiMentah.replace(/\./g, '');
                    }

                    let angka = parseFloat(angkaBersih);
                    if (!isNaN(angka)) {
                        total += angka;
                    }
                }
            });
            return "Rp " + Math.round(total).toLocaleString('id-ID');
        }

        function parseNilaiFisik(fisikStr) {
            if (!fisikStr) return 0;
            let bersih = fisikStr.toString().trim().replace(/[^0-9.,]/g, '').replace(',', '.');
            let val = parseFloat(bersih);
            if (isNaN(val)) return 0;
            return Math.min(Math.max(Math.round(val), 0), 100);
        }

        function renderData(groupedData) {
            const mainContent = document.getElementById('mainContent');
            mainContent.innerHTML = '';

            let totalSemuaKegiatan = 0;
            let akumulasiAlokasiSemua = 0;

            const urutanOPD = Object.keys(groupedData);

            urutanOPD.forEach(namaOPD => {
                let listKegiatan = groupedData[namaOPD];
                
                groupedData[namaOPD] = listKegiatan.filter(keg => {
                    let uraian = keg.kegiatan ? keg.kegiatan.toString().trim().toUpperCase() : "";
                    let anggaranCek = keg.anggaran ? keg.anggaran.toString().trim().toUpperCase() : "";
                    return uraian !== "" && !uraian.includes("TOTAL") && !uraian.includes("JUMLAH") && !anggaranCek.includes("TOTAL");
                });
            });

            urutanOPD.forEach(namaOPD => {
                const listKegiatan = groupedData[namaOPD];
                totalSemuaKegiatan += listKegiatan.length;

                listKegiatan.forEach(keg => {
                    if (keg.anggaran) {
                        let nilaiMentah = keg.anggaran.toString().trim().replace(/[^0-9.,]/g, '');
                        let angkaBersih = nilaiMentah;

                        if (nilaiMentah.includes(',') && nilaiMentah.includes('.')) {
                            if (nilaiMentah.lastIndexOf(',') > nilaiMentah.lastIndexOf('.')) {
                                angkaBersih = nilaiMentah.replace(/\./g, '').replace(',', '.');
                            } else {
                                angkaBersih = nilaiMentah.replace(/,/g, '');
                            }
                        } else if (nilaiMentah.includes(',')) {
                            angkaBersih = nilaiMentah.replace(/\./g, '').replace(',', '.');
                        } else if (nilaiMentah.split('.').length > 2) {
                            angkaBersih = nilaiMentah.replace(/\./g, '');
                        }

                        let angka = parseFloat(angkaBersih);
                        if (!isNaN(angka)) akumulasiAlokasiSemua += angka;
                    }
                });
            });

            const formatTotalAlokasi = "Rp " + Math.round(akumulasiAlokasiSemua).toLocaleString('id-ID');
            const ringkasanWrapper = document.createElement('div');
            ringkasanWrapper.className = 'opd-card';
            ringkasanWrapper.style.cssText = 'background: transparent; border: none; box-shadow: none; margin-bottom: 16px;';
            ringkasanWrapper.innerHTML = `
                <div style="display: flex; gap: 10px; width: 100%;">
                    <div style="flex: 1; background: #03ad3c; color: #fff; border-radius: 18px; padding: 14px; text-align: center;">
                        <div style="font-size: 0.7rem; text-transform: uppercase; font-weight: 600; margin-bottom: 4px;">Total Alokasi</div>
                        <div style="font-size: 1rem; font-weight: 850;">${formatTotalAlokasi}</div>
                    </div>
                    <div style="flex: 1; background: #0740aa; color: #fff; border-radius: 18px; padding: 14px; text-align: center;">
                        <div style="font-size: 0.7rem; text-transform: uppercase; font-weight: 600; margin-bottom: 4px;">Total Kegiatan</div>
                        <div style="font-size: 1rem; font-weight: 850;">${totalSemuaKegiatan} Kegiatan</div>
                    </div>
                </div>`;
            mainContent.appendChild(ringkasanWrapper);

            urutanOPD.forEach((namaOPD, index) => {
                const listKegiatan = groupedData[namaOPD];
                if (listKegiatan.length === 0) return;

                const idOPD = 'opd-' + index;
                const totalAlokasiOPD = hitungTotalAlokasi(listKegiatan);

                let kegiatanHtml = '';
                listKegiatan.forEach((keg, idx) => {
                    let nomorUrut = idx + 1;
                    let uraian = keg.kegiatan || "-";
                    let alokasi = formatRupiah(keg.anggaran);
                    let status = keg.status || "-";
                    let warnaKat = deteksiKategoriWarna(keg.warnaStatus, status);
                    let badgeStyle = getBadgeStyle(keg.warnaStatus, status);
                    let fisikStr = keg.fisik || "0%";
                    let nilaiFisik = parseNilaiFisik(fisikStr);
                    let ket = keg.keterangan || "-";

                    kegiatanHtml += `
                        <div class="kegiatan-card" data-nama="${uraian.toLowerCase()}" data-kategori="${warnaKat}">
                            <div class="kegiatan-main-info">
                                <div class="kegiatan-text-cell">
                                    <div class="kegiatan-title">${nomorUrut}. ${uraian}</div>
                                    <div class="kegiatan-pagu">Alokasi: ${alokasi}</div>
                                    <div class="progress-container">
                                        <div class="progress-label-wrap">
                                            <span>Progres Fisik</span>
                                            <span>${fisikStr}</span>
                                        </div>
                                        <div class="progress-bar-bg">
                                            <div class="progress-bar-fill" style="width: ${nilaiFisik}%;"></div>
                                        </div>
                                    </div>
                                </div>
                                <div class="kegiatan-action-cell">
                                    <button class="btn btn-orange" onclick="toggleSubDetail(this)">Detail</button>
                                </div>
                            </div>
                            <div class="kegiatan-sub-detail">
                                <div class="detail-row"><div class="detail-label">Status Saat Ini</div><div class="detail-value"><span class="status-badge" style="${badgeStyle}">${status}</span></div></div>
                                <div class="detail-row"><div class="detail-label">Progres Fisik</div><div class="detail-value">${fisikStr}</div></div>
                                <div class="detail-row"><div class="detail-label">Keterangan</div><div class="detail-value">${ket}</div></div>
                            </div>
                        </div>`;
                });

                let opdCard = document.createElement('div');
                opdCard.className = 'opd-card';
                opdCard.innerHTML = `
                    <div class="opd-main-info">
                        <div class="opd-logo-cell">
                            <img class="opd-logo" src="${getLogoFilename(namaOPD)}" alt="${namaOPD}" onerror="this.src='https://placehold.co/70x70?text=${encodeURIComponent(namaOPD)}';">
                        </div>
                        <div class="opd-details-cell">
                            <div class="opd-title">${namaOPD}</div>
                            <div class="opd-meta">
                                Alokasi: <span class="pagu-total">${totalAlokasiOPD}</span><br>
                                Jumlah: <span>${listKegiatan.length} Kegiatan</span>
                            </div>
                        </div>
                        <div class="opd-action-cell">
                            <button class="btn btn-primary" onclick="toggleOPD(this, 'list-${idOPD}')">Detail</button>
                        </div>
                    </div>
                    <div id="list-${idOPD}" class="kegiatan-container">${kegiatanHtml}</div>`;
                mainContent.appendChild(opdCard);
            });

            mulasiAnimasiJatuhBerurutan();
        }

        function mulasiAnimasiJatuhBerurutan() {
            const semuaKartu = document.querySelectorAll('.opd-card');
            semuaKartu.forEach((kartu, index) => {
                setTimeout(() => {
                    kartu.classList.add('mulai-animasi');
                    
                    // Mainkan suara secara berurutan seiring jatuhnya kartu
                    try {
                        let cloneSound = tapSound.cloneNode(); // Clone agar bisa bunyi bertumpuk cepat
                        cloneSound.volume = 0.3;
                        cloneSound.play().catch(() => {});
                    } catch(e) {}

                }, index * 100);
            });
        }

        function filterKategori(kategori, btnElement) {
            // Mainkan suara saat tombol filter diklik
            try {
                tapSound.currentTime = 0;
                tapSound.play().catch(() => {});
            } catch(e) {}

            kategoriAktif = kategori;

            document.querySelectorAll('.btn-filter-kat').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            jalankanPencarian();
        }

        function toggleOPD(button, containerId) {
            // Mainkan suara saat tombol Detail/Tutup OPD diklik
            try {
                tapSound.currentTime = 0;
                tapSound.play().catch(() => {});
            } catch(e) {}

            var container = document.getElementById(containerId);
            if (container.style.display === "block") {
                container.style.display = "none";
                button.textContent = "Detail";
                button.className = "btn btn-primary";
            } else {
                container.style.display = "block";
                button.textContent = "Tutup";
                button.className = "btn btn-success";
            }
        }

        function toggleSubDetail(button) {
            // Mainkan suara saat tombol Detail/Tutup Kegiatan diklik
            try {
                tapSound.currentTime = 0;
                tapSound.play().catch(() => {});
            } catch(e) {}

            var kegiatanCard = button.closest('.kegiatan-card');
            var subDetail = kegiatanCard.querySelector('.kegiatan-sub-detail');
            if (subDetail.style.display === "block") {
                subDetail.style.display = "none";
                button.textContent = "Detail";
                button.className = "btn btn-orange";
            } else {
                document.querySelectorAll('.kegiatan-sub-detail').forEach(el => el.style.display = 'none');
                subDetail.style.display = "block";
                button.textContent = "Tutup";
                button.className = "btn btn-success";
            }
        }

        function jalankanPencarian() {
            let keyword = document.getElementById('searchInput').value.toLowerCase();
            let kartuOPD = document.querySelectorAll('.opd-card');

            kartuOPD.forEach(opdCard => {
                let containerKegiatan = opdCard.querySelector('.kegiatan-container');
                let tombolOPD = opdCard.querySelector('.opd-action-cell button');
                let daftarKegiatan = opdCard.querySelectorAll('.kegiatan-card');
                
                if (daftarKegiatan.length === 0) return;

                let adaKegiatanCocok = false;

                daftarKegiatan.forEach(card => {
                    let nama = card.getAttribute('data-nama') || "";
                    let katWarna = card.getAttribute('data-kategori') || "";

                    let cocokKeyword = (keyword === "" || nama.includes(keyword));
                    let cocokKategori = (kategoriAktif === 'semua' || katWarna === kategoriAktif);

                    if (cocokKeyword && cocokKategori) {
                        card.style.display = "block";
                        adaKegiatanCocok = true;
                    } else {
                        card.style.display = "none";
                    }
                });

                if (keyword !== "" || kategoriAktif !== 'semua') {
                    if (adaKegiatanCocok) {
                        opdCard.style.display = "block";
                        if (containerKegiatan) containerKegiatan.style.display = "block";
                        if (tombolOPD) {
                            tombolOPD.textContent = "Tutup";
                            tombolOPD.className = "btn btn-success";
                        }
                    } else {
                        opdCard.style.display = "none";
                    }
                } else {
                    opdCard.style.display = "block";
                    if (containerKegiatan) containerKegiatan.style.display = "none";
                    if (tombolOPD) {
                        tombolOPD.textContent = "Detail";
                        tombolOPD.className = "btn btn-primary";
                    }
                }
            });
        }
    </script>
</body>
</html>
